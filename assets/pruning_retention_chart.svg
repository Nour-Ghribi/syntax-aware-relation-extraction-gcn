<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Dependency pruning retained-node chart</title>
  <desc id="desc">Bar chart comparing retained dependency graph nodes for full tree, k=0, k=1, and k=2 pruning on train.json example index 0.</desc>
  <defs>
    <style>
      .bg { fill: #f8fbfd; }
      .title { font: 700 25px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 13px Arial, sans-serif; fill: #53687a; }
      .axis { stroke: #8ca1b1; stroke-width: 1.3; }
      .grid { stroke: #dce7ee; stroke-width: 1; }
      .label { font: 700 13px Arial, sans-serif; fill: #20384f; }
      .small { font: 400 12px Arial, sans-serif; fill: #53687a; }
      .value { font: 700 13px Arial, sans-serif; fill: #17324d; }
      .bar-full { fill: #264766; }
      .bar-k0 { fill: #d97872; }
      .bar-k1 { fill: #2d9a86; }
      .bar-k2 { fill: #61a8c7; }
      .note { font: 400 11px Arial, sans-serif; fill: #687a88; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="500"/>
  <text class="title" x="490" y="42" text-anchor="middle">Dependency Pruning: Retained Nodes by Configuration</text>
  <text class="subtitle" x="490" y="67" text-anchor="middle">Verified on train.json example index 0; structural graph retention only, not model accuracy.</text>

  <line class="grid" x1="110" y1="370" x2="900" y2="370"/>
  <line class="grid" x1="110" y1="304" x2="900" y2="304"/>
  <line class="grid" x1="110" y1="238" x2="900" y2="238"/>
  <line class="grid" x1="110" y1="172" x2="900" y2="172"/>
  <line class="grid" x1="110" y1="106" x2="900" y2="106"/>
  <line class="axis" x1="110" y1="370" x2="900" y2="370"/>
  <line class="axis" x1="110" y1="92" x2="110" y2="370"/>

  <text class="small" x="90" y="374" text-anchor="end">0</text>
  <text class="small" x="90" y="308" text-anchor="end">25%</text>
  <text class="small" x="90" y="242" text-anchor="end">50%</text>
  <text class="small" x="90" y="176" text-anchor="end">75%</text>
  <text class="small" x="90" y="110" text-anchor="end">100%</text>

  <!-- Chart area: y = 370 - percent * 2.64 -->
  <rect class="bar-full" x="180" y="106" width="105" height="264" rx="8"/>
  <rect class="bar-k0" x="365" y="322" width="105" height="48" rx="8"/>
  <rect class="bar-k1" x="550" y="250" width="105" height="120" rx="8"/>
  <rect class="bar-k2" x="735" y="250" width="105" height="120" rx="8"/>

  <text class="value" x="232.5" y="92" text-anchor="middle">22 / 22</text>
  <text class="value" x="417.5" y="308" text-anchor="middle">4 / 22</text>
  <text class="value" x="602.5" y="236" text-anchor="middle">10 / 22</text>
  <text class="value" x="787.5" y="236" text-anchor="middle">10 / 22</text>

  <text class="label" x="232.5" y="402" text-anchor="middle">Full tree</text>
  <text class="small" x="232.5" y="423" text-anchor="middle">100%</text>
  <text class="label" x="417.5" y="402" text-anchor="middle">k=0</text>
  <text class="small" x="417.5" y="423" text-anchor="middle">18.18%</text>
  <text class="label" x="602.5" y="402" text-anchor="middle">k=1</text>
  <text class="small" x="602.5" y="423" text-anchor="middle">45.45%</text>
  <text class="label" x="787.5" y="402" text-anchor="middle">k=2</text>
  <text class="small" x="787.5" y="423" text-anchor="middle">45.45%</text>

  <text class="note" x="490" y="464" text-anchor="middle">For this example, k=2 retains the same nodes as k=1 because no additional nodes fall within distance two of the path.</text>
</svg>
