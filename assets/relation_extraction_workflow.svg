<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Syntax-aware relation extraction workflow</title>
  <desc id="desc">End-to-end workflow from an input sentence with subject and object entities through linguistic features, dependency pruning, GCN or C-GCN encoding, pooling, and relation classification.</desc>
  <defs>
    <style>
      .bg { fill: #f8fbfd; }
      .panel { fill: #ffffff; stroke: #d8e3ea; stroke-width: 1.4; rx: 14; }
      .panel-blue { fill: #eef7fb; stroke: #7bb6c9; stroke-width: 1.4; rx: 14; }
      .panel-teal { fill: #edf8f5; stroke: #63b8a4; stroke-width: 1.4; rx: 14; }
      .panel-navy { fill: #edf2f7; stroke: #264766; stroke-width: 1.4; rx: 14; }
      .title { font: 700 28px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #506274; }
      .label { font: 700 15px Arial, sans-serif; fill: #18324a; }
      .small { font: 400 12px Arial, sans-serif; fill: #53687a; }
      .micro { font: 400 11px Arial, sans-serif; fill: #607383; }
      .arrow { stroke: #587489; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .branch { stroke: #6aa795; stroke-width: 2; fill: none; marker-end: url(#arrowhead-teal); }
      .badge-red { fill: #fae9e8; stroke: #d97872; }
      .badge-blue { fill: #e8f1fb; stroke: #6e9ccd; }
      .badge-text { font: 700 11px Arial, sans-serif; fill: #20384f; }
    </style>
    <marker id="arrowhead" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#587489"/>
    </marker>
    <marker id="arrowhead-teal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#6aa795"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="520"/>
  <text class="title" x="720" y="44" text-anchor="middle">End-to-End Syntax-Aware Relation Extraction Workflow</text>
  <text class="subtitle" x="720" y="70" text-anchor="middle">Implementation-aligned pipeline: TACRED-style fields, path-centric pruning, GCN/C-GCN encoding, pooling, and relation classification.</text>

  <rect class="panel" x="42" y="128" width="178" height="120"/>
  <text class="label" x="131" y="160" text-anchor="middle">Input Sentence</text>
  <text class="small" x="131" y="187" text-anchor="middle">Subject + object spans</text>
  <rect class="badge-red" x="75" y="206" width="48" height="22" rx="8"/>
  <text class="badge-text" x="99" y="221" text-anchor="middle">SUBJ</text>
  <rect class="badge-blue" x="137" y="206" width="48" height="22" rx="8"/>
  <text class="badge-text" x="161" y="221" text-anchor="middle">OBJ</text>

  <rect class="panel-blue" x="270" y="128" width="178" height="120"/>
  <text class="label" x="359" y="156" text-anchor="middle">Linguistic</text>
  <text class="label" x="359" y="176" text-anchor="middle">Features</text>
  <text class="small" x="359" y="205" text-anchor="middle">Tokens, POS, NER</text>
  <text class="small" x="359" y="224" text-anchor="middle">dependency heads</text>

  <rect class="panel" x="498" y="128" width="178" height="120"/>
  <text class="label" x="587" y="160" text-anchor="middle">Embeddings</text>
  <text class="small" x="587" y="190" text-anchor="middle">Word + POS + NER</text>
  <text class="micro" x="587" y="214" text-anchor="middle">node feature matrix</text>

  <rect class="panel-teal" x="498" y="298" width="178" height="120"/>
  <text class="label" x="587" y="330" text-anchor="middle">Dependency Tree</text>
  <text class="small" x="587" y="359" text-anchor="middle">head_to_tree</text>
  <text class="micro" x="587" y="383" text-anchor="middle">tree_to_adj</text>

  <rect class="panel-teal" x="725" y="298" width="178" height="120"/>
  <text class="label" x="814" y="327" text-anchor="middle">Shortest Path</text>
  <text class="small" x="814" y="357" text-anchor="middle">subject to object</text>
  <text class="micro" x="814" y="381" text-anchor="middle">path-centric core</text>

  <rect class="panel-teal" x="952" y="298" width="178" height="120"/>
  <text class="label" x="1041" y="327" text-anchor="middle">Pruning</text>
  <text class="small" x="1041" y="357" text-anchor="middle">k = 0, 1, 2</text>
  <text class="micro" x="1041" y="381" text-anchor="middle">retained dependency graph</text>

  <rect class="panel-navy" x="725" y="128" width="178" height="120"/>
  <text class="label" x="814" y="155" text-anchor="middle">Encoder Choice</text>
  <text class="small" x="814" y="185" text-anchor="middle">GCN: embeddings</text>
  <text class="small" x="814" y="205" text-anchor="middle">C-GCN: BiLSTM first</text>
  <text class="micro" x="814" y="228" text-anchor="middle">CPU forward verified</text>

  <rect class="panel-navy" x="952" y="128" width="178" height="120"/>
  <text class="label" x="1041" y="160" text-anchor="middle">GCN Layers</text>
  <text class="small" x="1041" y="190" text-anchor="middle">adjacency-aware</text>
  <text class="small" x="1041" y="210" text-anchor="middle">message passing</text>

  <rect class="panel" x="1180" y="128" width="178" height="120"/>
  <text class="label" x="1269" y="158" text-anchor="middle">Pooling</text>
  <text class="small" x="1269" y="187" text-anchor="middle">Graph-level</text>
  <text class="small" x="1269" y="207" text-anchor="middle">subject + object</text>

  <rect class="panel" x="1180" y="298" width="178" height="120"/>
  <text class="label" x="1269" y="330" text-anchor="middle">Classifier</text>
  <text class="small" x="1269" y="360" text-anchor="middle">MLP + linear layer</text>
  <text class="micro" x="1269" y="384" text-anchor="middle">semantic relation logits</text>

  <path class="arrow" d="M220 188 L270 188"/>
  <path class="arrow" d="M448 188 L498 188"/>
  <path class="arrow" d="M448 214 C470 254 482 310 498 350"/>
  <path class="arrow" d="M676 358 L725 358"/>
  <path class="arrow" d="M903 358 L952 358"/>
  <path class="branch" d="M676 188 L725 188"/>
  <path class="branch" d="M1130 358 C1160 348 1166 250 1180 205"/>
  <path class="arrow" d="M903 188 L952 188"/>
  <path class="arrow" d="M1130 188 L1180 188"/>
  <path class="arrow" d="M1269 248 L1269 298"/>

  <text class="micro" x="720" y="475" text-anchor="middle">Structural validation only: diagrams describe the implemented code path and do not report predictive accuracy.</text>
</svg>
